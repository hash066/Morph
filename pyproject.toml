[project]
name = "morph-recovery"
version = "0.1.0"
description = "Evidence-first SO-101 recovery experiments"
requires-python = ">=3.11,<3.13"
dependencies = ["fastapi>=0.115,<1", "pydantic>=2.10,<3", "httpx>=0.28,<1", "uvicorn>=0.34,<1"]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-cov>=6,<8", "ruff>=0.11", "mypy>=1.15"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/morph"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.mypy]
files = ["src/morph"]
check_untyped_defs = true

[tool.coverage.run]
# Simulator overlays and the CLI are exercised by preserved real-runtime audits.
# Unit coverage gates the deterministic orchestration core.
omit = ["src/morph/isaac_callback.py", "src/morph/isaac_runner.py", "src/morph/__main__.py"]
